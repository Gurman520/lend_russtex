version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: rusteks-mongo
    restart: always
    ports:
      - "27017:27017"   # опционально для внешнего доступа 
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: rusteks
    volumes:
      - mongo-data:/data/db
    networks:
      - rusteks-net

  # Node.js приложение
  app:
    build: .
    container_name: rusteks-app
    restart: always
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://root:example@mongodb:27017/rusteks?authSource=admin
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - TARGET_MAIL=${TARGET_MAIL}
      - PORT=3000
    volumes:
      - ./public:/app/public   # для удобства разработки
    networks:
      - rusteks-net
    # Запускаем seed перед сервером
    command: sh -c "node seed.js && node server.js"

  # Nginx (реверс-прокси)
  nginx:
    image: nginx:1.27-alpine
    container_name: rusteks-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"   # HTTPS, если настроите сертификаты
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - rusteks-net

  certbot:
    image: certbot/certbot:latest
    container_name: rusteks_certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network

volumes:
  mongo-data:

networks:
  rusteks-net:
    driver: bridge